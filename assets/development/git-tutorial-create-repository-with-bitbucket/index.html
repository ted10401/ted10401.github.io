<p>這次來分享如何建立 Git 版本控制系統</p>
<p>第一篇為使用 Bitbucket 來建立版本控制專案</p>

<p><a href="https://bitbucket.org/" rel="noopener noreferrer" target="_blank">Bitbucket</a></p>

<p>申請帳號部分就跳過了</p>
<p>就是按照步驟來申請新帳號</p>

<p>如果是第一次使用 Bitbucket</p>
<p>再登入後不會顯示任何的現存專案</p>

<p>如果是已經使用過</p>
<p>則會有一些現存專案顯示在上面</p>

<p>接下來要建立新專案</p>
<p>點選最上面的 Create/Create repository</p>

<p><img alt="Create Repository with Bitbucket – 使用 Bitbucket 建立新專案 插圖" decoding="async" height="192" loading="lazy" src="2d2dbef68893d49692e39df8ea2425c9.png" width="1424"></p>

<p><img alt="Create Repository with Bitbucket – 使用 Bitbucket 建立新專案 插圖" decoding="async" height="1318" loading="lazy" src="ee7fef04b942deeb1fe81a83e1062b27.png" width="1960"></p>

<p>Repository name：專案名稱</p>
<p>Repository type：Git</p>
<p>Language：C#</p>
<p>接著點選 Create repository 就會建立新的 Git 專案</p>
