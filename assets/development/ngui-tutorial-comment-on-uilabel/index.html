<p><b>建立 UI Label</b></p>
<p>點選 NGUI → Create → Label</p>
<p><img alt="Comment on UILabel – 建立第一個文字 插圖" decoding="async" height="316" loading="lazy" src="4b0f171c00c5b3ec89dddb730f1e728a.jpg" width="839"></p>

<p>點選 UI Label 腳本中的 Font 屬性</p>
<p>即可選擇預設的 Arial 字體</p>
<p><img alt="Comment on UILabel – 建立第一個文字 插圖" decoding="async" height="943" loading="lazy" src="d94296ea021aab68c3bb5a20e85653ba.jpg" width="1363"></p>
<p><img alt="Comment on UILabel – 建立第一個文字 插圖" decoding="async" height="943" loading="lazy" src="8c2bfe4b1e74a536dd2e1f71a080b3e1.jpg" width="1022"></p>

<p>接下來若要修改顯示的文字</p>
<p>可以直接在 UI Label 腳本中的 Text 屬性進行修改</p>
<p><img alt="Comment on UILabel – 建立第一個文字 插圖" decoding="async" height="945" loading="lazy" src="aa97b2b24c1138e21cb62a695a8a4f36.jpg" width="1362"></p>
