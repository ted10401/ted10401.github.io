<p>目前專案中只有擁有者一人而已</p>
<p>而 Git 最方便的就是能夠讓多數人同時對一個專案進行開發<br>
所以這裡我們來試著新增專案成員</p>

回到 Bitbucket 專案頁面<br>
並點選 Send Invitation<br>
<img alt="Invite Users to Bitbucket – 邀請 Bitbucket 專案成員 插圖" decoding="async" height="1121" loading="lazy" src="3c7761496f2736edd72d610bc18de42b.png" width="2180">輸入被邀請者的名稱或是 Email 後點選 Add<br>
<img alt="Invite Users to Bitbucket – 邀請 Bitbucket 專案成員 插圖" decoding="async" height="572" loading="lazy" src="bd7e31a73e6a97168228785229a8db3f.png" width="1204">接者修改被邀請者權限<br>
Read：可讀<br>
Write：可寫<br>
Admin：管理員<br>
<img alt="Invite Users to Bitbucket – 邀請 Bitbucket 專案成員 插圖" decoding="async" height="774" loading="lazy" src="3b9ec66dacec2fb4d226c68f85824318.png" width="1206">按下右下角 Share 完成邀請成員動作
<p><img alt="Invite Users to Bitbucket – 邀請 Bitbucket 專案成員 插圖" decoding="async" height="774" loading="lazy" src="8a64b01de86617e5a3d343a65af072ee.png" width="1206"></p>
