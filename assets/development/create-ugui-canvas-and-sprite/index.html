<p>首先在 uGUI 中所有的 UI 都需要歸類在 Canvas 底下<br>
可以將 Canvas 理解為畫板<br>
創建 Canvas 可以透過下列方法<br>
<img alt="Create UGUI Canvas and Sprite – 建立 UGUI 面板、建立第一張圖片 插圖" decoding="async" height="894" loading="lazy" src="03ee85234300b736b008a66737c384ab.png" width="714"><br>
<img alt="Create UGUI Canvas and Sprite – 建立 UGUI 面板、建立第一張圖片 插圖" decoding="async" height="630" loading="lazy" src="bd5926bee2bd0aea89a600c10b1813dc.png" width="520"></p>
<p>生成 Canvas 後<br>
會在場景中新增 Canvas, EventSystem 兩個物件<br>
<img alt="Create UGUI Canvas and Sprite – 建立 UGUI 面板、建立第一張圖片 插圖" decoding="async" height="244" loading="lazy" src="bc99049f442f034409afcefdf5e81fde.png" width="470"></p>
<p>接下來讓我們建立第一張圖片<br>
建立圖片的方法和建立 Canvas 一樣<br>
<img alt="Create UGUI Canvas and Sprite – 建立 UGUI 面板、建立第一張圖片 插圖" decoding="async" height="628" loading="lazy" src="fe01b854ddd51f22b3e3682ed76ef26a.png" width="522"></p>
<p>Image 生成時會自動對應到剛剛的 Canvas 中<br>
如果場景中沒有 Canvas，則會自動生成<br>
<img alt="Create UGUI Canvas and Sprite – 建立 UGUI 面板、建立第一張圖片 插圖" decoding="async" height="1426" loading="lazy" src="07c15dee5e51801f17c5b3c78a2d315a.png" width="1510"></p>
<p>再來只要給予 Image 對應的設定<br>
就可以完成第一張圖片的建立<br>
<img alt="Create UGUI Canvas and Sprite – 建立 UGUI 面板、建立第一張圖片 插圖" decoding="async" height="1430" loading="lazy" src="6289a06b48c217738e37e0088f80050d.png" width="2072"></p>
