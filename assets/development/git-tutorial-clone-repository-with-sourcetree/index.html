<p>在上一篇中</p>
<p>利用了 Bitbucket 來建立新的 Git 專案</p>
<p>但目前專案中還沒有任何東西</p>
<p><img alt="Clone Repository with SourceTree – 使用 SourceTree 下載 Repository 插圖" decoding="async" height="1141" loading="lazy" src="63f62facafe475cfdaba9da95ddd034e.png" width="2038"></p>

<p>我們需要使用到另一個軟體 SourceTree</p>

<p><a href="https://www.sourcetreeapp.com/" rel="noopener noreferrer" target="_blank">SourceTree</a></p>

<p>下載並安裝 SourceTree</p>
<p>回到 Bitbucket 頁面並點選 Clone/Clone in SourceTree</p>
<p><img alt="Clone Repository with SourceTree – 使用 SourceTree 下載 Repository 插圖" decoding="async" height="1244" loading="lazy" src="c8f1a695e90dd39af6645112ff7f16cd.png" width="1304"></p>

<p>這邊會開啟 SourceTree 並需要選擇專案路徑</p>
<p>(專案路徑可以隨意命名)</p>
<p>(並不需要與 Bitbucket 上的專案名稱相同)</p>
<p>按下 Clone</p>
<p><img alt="Clone Repository with SourceTree – 使用 SourceTree 下載 Repository 插圖" decoding="async" height="484" loading="lazy" src="73e6da1bfafc0c22795228d5696aea0e.png" width="1244"></p>

<p>成功後會開啟這個畫面</p>
<p>到這邊就完成了下載 Repository 到本地端電腦的步驟</p>
<p><img alt="Clone Repository with SourceTree – 使用 SourceTree 下載 Repository 插圖" decoding="async" height="1132" loading="lazy" src="45647ba468552c00db9caa1b318298e1.png" width="2104"></p>
