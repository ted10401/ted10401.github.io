<p>如果在 Push 時遇到了以下錯誤</p>
<p>*** Please tell me who you are.</p>
<p>Run</p>
<p>  git config –global user.email “you@example.com”</p>
<p>  git config –global user.name “Your Name”</p>
<p>修正方法為</p>
<p>點選右上方 Settings</p>
<p><img alt="Fix Please Tell Me Who You Are Error – 修正 Please Tell Me Who You Are 錯誤 插圖" decoding="async" height="104" loading="lazy" src="4df8c4cb2e46fcde9ed57373aed1bfb7.png" width="108"></p>

<p>點選 Advanced</p>
<p><img alt="Fix Please Tell Me Who You Are Error – 修正 Please Tell Me Who You Are 錯誤 插圖" decoding="async" height="612" loading="lazy" src="30ecc1b97455f09c0c3b74dd85de6809.png" width="1138"></p>

<p>取消勾選 Use global user settings</p>
<p>並填入 Full Name 及正確 Email address</p>
<p>按下 OK 後即可修復 Error</p>
<p><img alt="Fix Please Tell Me Who You Are Error – 修正 Please Tell Me Who You Are 錯誤 插圖" decoding="async" height="1078" loading="lazy" src="d66fdc4f3640fb77f3c1494faeedefd6.png" width="1138"></p>
